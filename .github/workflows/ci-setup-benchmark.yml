name: CI Setup Benchmark

on:
  workflow_dispatch:
    inputs:
      caches:
        description: JSON array of cache configurations
        default: '["legacy","none","scoped","fresh"]'
        type: string
      dependency_ref:
        description: Optional revision whose dependencies should be measured
        type: string

jobs:
  npm:
    name: npm / ${{ matrix.cache }}
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cache: ${{ fromJSON(inputs.caches) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.dependency_ref || github.sha }}
      - name: Inspect existing toolchain
        run: |
          command -v node || true
          node --version || true
          command -v php || true
          php --version || true
          command -v composer || true
          composer --version || true
      - if: matrix.cache == 'scoped' || matrix.cache == 'fresh'
        name: Isolate the current lockfile's download cache
        env:
          CACHE_MODE: ${{ matrix.cache }}
        run: |
          if [ "$CACHE_MODE" = fresh ]; then
            echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/blockstudio-npm" >> "$GITHUB_ENV"
          else
            echo "NPM_CONFIG_CACHE=$HOME/.cache/blockstudio/npm" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: ${{ matrix.cache == 'legacy' && 'npm' || '' }}
          package-manager-cache: false
      - if: matrix.cache == 'scoped'
        uses: actions/cache@v4
        with:
          path: ~/.cache/blockstudio/npm
          key: blockstudio-npm-scoped-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Measure dependency installation
        run: scripts/ci/npm-ci.sh
      - name: Record resulting cache size
        run: du -sk "$(npm config get cache)"
