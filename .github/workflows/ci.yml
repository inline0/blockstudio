name: CI

on:
  push:
    branches: [main, '7.*', tooling-upgrade]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Readable wp-env Docker project name for raw wp-env steps; the empty/impl npm scripts override it.
env:
  COMPOSE_PROJECT_NAME: blockstudio
  WP_ENV_PHP_VERSION: '8.3'
  BENCHMARK_SPEC: ''

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node

      - run: scripts/ci/npm-ci.sh

      - run: npm ci --prefix packages/registry --no-audit --no-fund

      - name: JavaScript, docs, schema, and product-neutrality checks
        run: npm run check

      - name: Verify WordPress production build
        run: |
          npm run build
          git diff --exit-code -- includes/admin/assets includes/ui/blocks includes/assets/runtime

      - name: Registry unit tests
        run: npm --prefix packages/registry run test:unit

  phpcs:
    name: PHPCS
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - run: composer install --no-interaction

      - name: Composer security audit
        run: |
          composer audit --locked
          composer audit --locked --working-dir=tests/theme

      - name: PHPCS
        run: composer cs

      - name: Private dependency isolation
        run: composer test:dependencies

      - name: Prepare shared test dependencies
        run: |
          composer install --no-interaction --working-dir=tests/theme
          tar -czf "$RUNNER_TEMP/php-dependencies.tar.gz" vendor tests/theme/vendor

      - uses: actions/upload-artifact@v4
        with:
          name: php-dependencies
          path: ${{ runner.temp }}/php-dependencies.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 7

  phpstan:
    name: PHPStan (Runtime)
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - uses: ./.github/actions/php-dependencies

      - name: Analyse the runtime
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  loading-modes:
    name: Loading Mode (${{ matrix.mode }})
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    env:
      BENCHMARK_PHP: '8.3'
      PLAYGROUND_WORKERS: '6'
    strategy:
      fail-fast: false
      matrix:
        mode: [plugin, mu-plugin, composer-theme, composer-plugin]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-php
        if: startsWith(matrix.mode, 'composer-')

      - run: scripts/ci/npm-ci.sh
      - uses: ./.github/actions/php-dependencies

      - name: Verify ${{ matrix.mode }} implementation on Playground
        run: node scripts/ci/benchmark-runtime.ts playground '${{ matrix.mode }}'

      - name: Upload loading-mode measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loading-mode-${{ matrix.mode }}-${{ github.run_attempt }}
          path: benchmarks/results/
          retention-days: 7

  unit:
    name: Unit Tests
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node

      - run: scripts/ci/npm-ci.sh
      - uses: ./.github/actions/php-dependencies

      - name: Run unit tests
        run: node scripts/ci/benchmark-runtime.ts wp-env unit

      - name: Upload unit results and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_attempt }}
          path: benchmarks/results/
          retention-days: 7

  phpstan-package:
    name: PHPStan Package Tests
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - run: composer install --no-interaction --working-dir=packages/phpstan
      - run: packages/phpstan/vendor/bin/phpunit --configuration packages/phpstan/phpunit.xml.dist
      - name: Analyze PHPStan package
        working-directory: packages/phpstan
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist --no-progress --memory-limit=512M

  e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/${{ matrix.total_shards }})
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node

      - run: scripts/ci/npm-ci.sh
      - uses: ./.github/actions/php-dependencies

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: node scripts/ci/benchmark-runtime.ts wp-env e2e-${{ matrix.shard }}
        env:
          BLOCKSTUDIO_E2E_SHARD: ${{ matrix.shard }}/${{ matrix.total_shards }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            benchmarks/results/
          retention-days: 7

  ui-regressions:
    name: UI Regression Tests
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: blockstudio-ui
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: scripts/ci/npm-ci.sh
      - uses: ./.github/actions/php-dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run UI regressions
        run: node scripts/ci/benchmark-runtime.ts wp-env ui
      - name: Upload UI regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-results-${{ github.run_attempt }}
          path: |
            test-results/
            tests/ui/test-results/
            benchmarks/results/
          retention-days: 7

  playground-smoke:
    name: Playground Smoke Tests
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    env:
      PLAYGROUND_PHP: '8.4'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: scripts/ci/npm-ci.sh
      - uses: ./.github/actions/php-dependencies
      - name: Install Playwright browsers
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Run optional Playground contributor workflow
        run: npm run test:e2e:playground -- tests/e2e/types/text.ts
      - name: Upload Playground artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-smoke-results-${{ github.run_attempt }}
          path: |
            test-results/
            benchmarks/results/
          retention-days: 7

  e2e-empty:
    name: E2E Tests (Empty Theme)
    needs: phpcs
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node

      - run: scripts/ci/npm-ci.sh
      - uses: ./.github/actions/php-dependencies

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run empty theme E2E tests
        run: node scripts/ci/benchmark-runtime.ts wp-env empty

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-empty-test-results-${{ github.run_attempt }}
          path: |
            test-results/
            benchmarks/results/
          retention-days: 7
