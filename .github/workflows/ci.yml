name: CI

on:
  push:
    branches: [main, '7.*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Readable wp-env Docker project name for raw wp-env steps; the empty/impl npm scripts override it.
env:
  COMPOSE_PROJECT_NAME: blockstudio

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Configure npm registries
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc

      - run: npm ci
      - run: composer install --no-interaction

      - name: JavaScript, docs, schema, and product-neutrality checks
        run: npm run check

      - name: PHPCS
        run: composer cs

  loading-modes:
    name: Loading Mode (${{ matrix.mode }})
    if: contains(github.event.head_commit.message, '[all]')
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [plugin, mu-plugin, composer-theme, composer-plugin]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Configure npm registries
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc

      - run: npm ci
      - run: composer install --no-interaction

      - name: Start ${{ matrix.mode }} implementation
        run: npm run wp-env:implementations:${{ matrix.mode }}:start

      - name: Verify ${{ matrix.mode }} implementation
        run: npm run wp-env:implementations:${{ matrix.mode }}:verify

      - name: Stop ${{ matrix.mode }} implementation
        if: always()
        run: npm run wp-env:implementations:${{ matrix.mode }}:stop

  unit:
    name: Unit Tests
    if: contains(github.event.head_commit.message, '[unit]') || contains(github.event.head_commit.message, '[all]')
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Configure npm registries
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc

      - run: npm ci
      - run: composer install --no-interaction
      - run: composer install --no-interaction --working-dir=tests/theme

      - name: Start wp-env
        run: npm run wp-env:start

      - name: Run unit tests
        run: |
          PLUGIN_DIR=$(cd tests/wp-env && npx @wordpress/env run cli -- wp eval 'echo BLOCKSTUDIO_DIR;' 2>/dev/null | tr -d '\r\n')
          echo "Plugin dir: $PLUGIN_DIR"
          cd tests/wp-env && npx @wordpress/env run cli --env-cwd="$PLUGIN_DIR" vendor/bin/phpunit --testdox --display-errors --display-warnings

  phpstan-package:
    name: PHPStan Package Tests
    if: contains(github.event.head_commit.message, '[unit]') || contains(github.event.head_commit.message, '[all]')
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - run: composer install --no-interaction --working-dir=packages/phpstan
      - run: packages/phpstan/vendor/bin/phpunit --configuration packages/phpstan/phpunit.xml.dist

  e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/${{ matrix.total_shards }})
    if: contains(github.event.head_commit.message, '[e2e]') || contains(github.event.head_commit.message, '[all]')
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Configure npm registries
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc

      - run: npm ci
      - run: composer install --no-interaction
      - run: composer install --no-interaction --working-dir=tests/theme

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npm run wp-env:reset

      - name: Install SEO plugins for E2E
        run: |
          cd tests/wp-env
          npx wp-env run cli -- wp plugin is-installed wordpress-seo || npx wp-env run cli -- wp plugin install wordpress-seo
          npx wp-env run cli -- wp plugin is-installed seo-by-rank-math || npx wp-env run cli -- wp plugin install seo-by-rank-math

      - name: Run E2E tests
        run: npx playwright test --config=playwright.wp-env.config.ts --shard=${{ matrix.shard }}/${{ matrix.total_shards }}

      - name: Stop main wp-env
        run: npm run wp-env:stop

      - name: Start empty wp-env
        run: npm run wp-env:empty:start

      - name: Run empty theme E2E tests
        run: npm run test:e2e:empty

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
