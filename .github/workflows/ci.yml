name: CI

on:
  push:
    branches: [main, '7.*', tooling-upgrade]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Readable wp-env Docker project name for raw wp-env steps; the empty/impl npm scripts override it.
env:
  COMPOSE_PROJECT_NAME: blockstudio

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: scripts/ci/npm-ci.sh

      - run: npm ci --prefix packages/registry --no-audit --no-fund

      - name: JavaScript, docs, schema, and product-neutrality checks
        run: npm run check

      - name: Verify WordPress production build
        run: |
          npm run build
          git diff --exit-code -- includes/admin/assets includes/ui/blocks includes/assets/runtime

      - name: Registry unit tests
        run: npm --prefix packages/registry run test:unit

  phpcs:
    name: PHPCS
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction

      - name: Composer security audit
        run: |
          composer audit --locked
          composer audit --locked --working-dir=tests/theme

      - name: PHPCS
        run: composer cs

      - name: Private dependency isolation
        run: composer test:dependencies

  phpstan:
    name: PHPStan (Runtime)
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction

      - name: Analyse the runtime
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  loading-modes:
    name: Loading Mode (${{ matrix.mode }})
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [plugin, mu-plugin, composer-theme, composer-plugin]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: scripts/ci/npm-ci.sh
      - run: composer install --no-interaction

      - name: Start ${{ matrix.mode }} implementation
        run: node scripts/ci/start-wp-env.ts ${{ matrix.mode }}

      - name: Verify ${{ matrix.mode }} implementation
        run: npm run wp-env:implementations:${{ matrix.mode }}:verify

      - name: Stop ${{ matrix.mode }} implementation
        if: always()
        run: npm run wp-env:implementations:${{ matrix.mode }}:stop

  unit:
    name: Unit Tests
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: scripts/ci/npm-ci.sh
      - run: composer install --no-interaction
      - run: composer install --no-interaction --working-dir=tests/theme

      - name: Start wp-env
        run: node scripts/ci/start-wp-env.ts

      - name: Run unit tests
        run: |
          PLUGIN_DIR=$(cd tests/wp-env && npx @wordpress/env run cli -- wp eval 'echo BLOCKSTUDIO_DIR;' 2>/dev/null | tr -d '\r\n')
          echo "Plugin dir: $PLUGIN_DIR"
          cd tests/wp-env && npx @wordpress/env run cli --env-cwd="$PLUGIN_DIR" vendor/bin/phpunit --testdox --display-errors --display-warnings

  phpstan-package:
    name: PHPStan Package Tests
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction --working-dir=packages/phpstan
      - run: packages/phpstan/vendor/bin/phpunit --configuration packages/phpstan/phpunit.xml.dist
      - name: Analyze PHPStan package
        working-directory: packages/phpstan
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist --no-progress --memory-limit=512M

  e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/${{ matrix.total_shards }})
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: scripts/ci/npm-ci.sh
      - run: composer install --no-interaction
      - run: composer install --no-interaction --working-dir=tests/theme

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: node scripts/ci/start-wp-env.ts

      - name: Install SEO plugins for E2E
        run: |
          cd tests/wp-env
          npx wp-env run cli -- wp plugin is-installed wordpress-seo || npx wp-env run cli -- wp plugin install wordpress-seo
          npx wp-env run cli -- wp plugin is-installed seo-by-rank-math || npx wp-env run cli -- wp plugin install seo-by-rank-math

      - name: Run E2E tests
        run: npx playwright test --config=playwright.wp-env.config.ts --shard=${{ matrix.shard }}/${{ matrix.total_shards }}

      - name: Stop main wp-env
        if: always()
        run: npm run wp-env:stop

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  ui-regressions:
    name: UI Regression Tests
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: blockstudio-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: scripts/ci/npm-ci.sh
      - run: composer install --no-interaction
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start UI regression site
        working-directory: tests/ui
        run: |
          node ../../scripts/ci/start-wp-env.ts ui
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp bs pages sync
      - name: Run UI regressions
        run: npm run test:e2e:ui:regressions
      - name: Stop UI regression site
        if: always()
        working-directory: tests/ui
        run: npx wp-env stop
      - name: Upload UI regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-results
          path: |
            test-results/
            tests/ui/test-results/
          retention-days: 7

  e2e-empty:
    name: E2E Tests (Empty Theme)
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: scripts/ci/npm-ci.sh
      - run: composer install --no-interaction

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start empty wp-env
        run: node scripts/ci/start-wp-env.ts empty

      - name: Run empty theme E2E tests
        run: npm run test:e2e:empty

      - name: Stop empty wp-env
        if: always()
        run: npm run wp-env:empty:stop

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-empty-test-results
          path: test-results/
          retention-days: 7
