name: CI Runtime Benchmark
run-name: CI benchmark / PHP ${{ inputs.php }} / workers ${{ inputs.playground_workers }} / cache ${{ inputs.npm_cache }}

on:
  workflow_dispatch:
    inputs:
      runtimes:
        description: JSON array of runtimes
        default: '["wp-env", "playground"]'
        required: true
      suites:
        description: JSON array of suites
        default: '["unit", "e2e-1", "e2e-2", "e2e-3", "e2e-4", "ui", "empty", "plugin", "mu-plugin", "composer-theme", "composer-plugin"]'
        required: true
      npm_cache:
        description: Restore the existing npm download cache
        type: boolean
        default: true
      php:
        description: PHP minor version for both WordPress runtimes
        default: '8.3'
        required: true
      playground_workers:
        description: Playground PHP worker count
        default: '6'
        required: true
      spec:
        description: Optional exact E2E filename for a focused diagnostic, not a full-suite measurement
        default: ''

concurrency:
  group: runtime-benchmark-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    name: ${{ matrix.runtime }} / ${{ matrix.suite }}
    runs-on: [self-hosted, Linux, X64, inline0-blockstudio]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}
        suite: ${{ fromJSON(inputs.suites) }}
    env:
      COMPOSE_PROJECT_NAME: blockstudio
      CI: true
      BENCHMARK_RUNTIME: ${{ matrix.runtime }}
      BENCHMARK_SUITE: ${{ matrix.suite }}
      BENCHMARK_PHP: ${{ inputs.php }}
      WP_ENV_PHP_VERSION: ${{ inputs.php }}
      PLAYGROUND_WORKERS: ${{ inputs.playground_workers }}
      BENCHMARK_SPEC: ${{ inputs.spec }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: matrix.suite != 'smoke' && inputs.spec == ''
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.npm_cache && 'npm' || '' }}
      - if: matrix.suite == 'smoke' || inputs.spec != ''
        uses: ./.github/actions/setup-node
      - if: matrix.suite == 'smoke' || inputs.spec != ''
        uses: ./.github/actions/setup-php
      - uses: shivammathur/setup-php@v2
        if: matrix.suite != 'smoke' && inputs.spec == ''
        with:
          php-version: '8.4'
      - run: scripts/ci/npm-ci.sh
      - run: composer install --no-interaction
      - if: startsWith(matrix.suite, 'e2e-') || matrix.suite == 'unit' || matrix.suite == 'smoke'
        run: composer install --no-interaction --working-dir=tests/theme
      - if: startsWith(matrix.suite, 'e2e-') || matrix.suite == 'ui' || matrix.suite == 'empty' || matrix.suite == 'smoke'
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Measure complete suite on the selected runtime
        run: node scripts/ci/benchmark-runtime.ts "$BENCHMARK_RUNTIME" "$BENCHMARK_SUITE"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.runtime }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            benchmarks/results/
            test-results/
            tests/ui/test-results/
          retention-days: 14
